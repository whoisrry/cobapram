{{define "content"}}
<section class="card narrow">
  <h1>Tambah client</h1>
  {{with .Message}}<p class="notice" role="status">{{.}}</p>{{end}}
  <form method="post" action="/admin/clients">
    {{.CSRF}}
    <label for="name">Nama</label>
    <input id="name" name="name" type="text" value="{{.Form.Name}}" maxlength="100" required autofocus>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{.Form.Email}}" maxlength="254" autocomplete="off" required>
    <label for="password">Password awal</label>
    <input id="password" name="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required>
    <label for="password_confirm">Ulangi password</label>
    <input id="password_confirm" name="password_confirm" type="password" minlength="12" maxlength="72" autocomplete="new-password" required>
    <p class="meta">Minimal 12 karakter. Akun dibuat dengan role client.</p>
    <div class="actions">
      <button type="submit">Simpan</button>
      <a href="/tickets">Batal</a>
    </div>
  </form>
</section>
{{end}}
